<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>첫밤 사망자 클럽</title>
<meta name="theme-color" content="#17171c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="첫밤클럽">
<!-- 카톡·문자 링크 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:title" content="첫밤 사망자 클럽">
<meta property="og:description" content="게임 도감 · 정모 일정 — 맨날 첫 밤에 죽는 사람들의 마피아 모임">
<meta property="og:image" content="https://hatsal037-design.github.io/firstnight-club/og.jpg">
<meta property="og:url" content="https://hatsal037-design.github.io/firstnight-club/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ─ 첫밤 사망자 클럽: 검정 · 레드 (포스터 팔레트) ─
   구조는 봉은사 벙 앱, 색과 장식은 클럽 포스터.
   포스터 모티프 — 빨간 막대 라벨 · 하드 섀도 · 체크무늬 띠 */
:root{
  --bg:#17171c; --surface:#1f1f26; --surface2:#26262f;
  --line:#33333f; --ink:#e9ecf1; --sub:#8b93a1;
  --red:#e8323c; --red-lite:#ff4757;
  --spring:cubic-bezier(0.32,0.72,0,1);
  --nav:calc(60px + env(safe-area-inset-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.028) 1px, transparent 1px);
  background-size:5px 5px;
  padding-bottom:calc(var(--nav) + 16px);
}
button,a,input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--red-lite)}

header{padding:calc(16px + env(safe-area-inset-top)) 18px 11px;display:flex;align-items:flex-start;gap:10px}
header h1{font-family:'Do Hyeon',sans-serif;font-size:24px;letter-spacing:-.5px;line-height:1.25;flex:1}
header h1 .r{color:var(--red)}
header .sub{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.6;font-family:'Pretendard',sans-serif}
.me{flex:none;text-align:right;font-size:11px;color:var(--sub);line-height:1.5;cursor:pointer;padding-top:4px}
.me .nk{color:var(--ink);font-weight:700;font-size:12.5px}
.me .adm{display:inline-block;background:var(--red);color:#fff;font-size:9px;font-weight:700;
         border-radius:3px;padding:2px 5px;margin-top:3px}
.checker{height:9px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 28px)}

.label{display:flex;align-items:center;gap:9px;font-family:'Jua',sans-serif;
       font-size:14px;color:var(--ink);letter-spacing:-.5px;margin:18px 18px 9px}
.label::before{content:'';width:5px;height:.85em;background:var(--red);border-radius:2px;flex:none}

nav{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:flex;
    background:rgba(23,23,28,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .nb{flex:1;text-align:center;padding:10px 0 9px;cursor:pointer;color:var(--sub)}
nav .nb .ic{font-size:18px;line-height:1.1;display:block}
nav .nb .tx{font-size:10px;font-weight:700;margin-top:3px;display:block;letter-spacing:-.4px}
nav .nb.on,nav .nb.on .tx{color:var(--red)}

.view{display:none}
.view.on{display:block}

.crew{margin:12px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 14px}
.crew .t{font-family:'Jua',sans-serif;font-size:13.5px;letter-spacing:-.5px}
.crew .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--sub);border-radius:999px;
      padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.crew .msg{font-size:11.5px;color:var(--sub);margin-top:9px;line-height:1.6}
.crew .msg b{color:var(--red-lite);font-weight:700}

.searchbox{margin:10px 14px 0;position:relative}
.searchbox input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;
                 padding:12px 38px 12px 13px;font-size:14px;outline:none}
.searchbox input::placeholder{color:#5d6472}
.searchbox input:focus{border-color:var(--red)}
.searchbox .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--sub);
              font-size:17px;cursor:pointer;padding:4px}

.cattabs{display:flex;margin:10px 14px;background:var(--surface);border:1px solid var(--line);
         border-radius:6px;overflow:hidden;position:sticky;top:8px;z-index:900;
         box-shadow:3px 3px 0 rgba(232,50,60,.45)}
.ctab{flex:1;text-align:center;padding:11px 0 10px;font-size:12.5px;font-weight:600;color:var(--sub);
      cursor:pointer;white-space:nowrap}
.ctab.on{color:#fff;background:var(--red)}

.sortrow{display:flex;align-items:center;justify-content:space-between;margin:0 18px 8px}
.sortrow .cnt{font-size:11.5px;color:var(--sub)}
.sortrow select{background:var(--surface);border:1px solid var(--line);border-radius:5px;
                padding:6px 8px;font-size:12px;outline:none}

.list{margin:0 14px}
.game{display:flex;align-items:flex-start;gap:11px;padding:13px;margin-bottom:9px;
      background:var(--surface);border:1px solid var(--line);border-radius:6px;
      transition:border-color 150ms ease,box-shadow 200ms var(--spring),opacity 150ms ease}
.game.dim{opacity:.34}
.game.fav{border-color:var(--red);box-shadow:3px 3px 0 rgba(232,50,60,.55)}
.game .info{flex:1;min-width:0;cursor:pointer}
.game .nm{font-family:'Do Hyeon',sans-serif;font-size:16.5px;letter-spacing:-.3px;line-height:1.3}
.game .meta{font-size:11.5px;color:var(--sub);margin-top:5px}
.game .meta b{color:var(--ink);font-weight:600}
.game .desc{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.55}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.bd{font-size:9.5px;font-weight:700;border-radius:3px;padding:3px 6px;
    border:1px solid var(--line);color:var(--sub);background:var(--surface2)}
.bd.lv초보{color:#7fd6a6;border-color:#2e5a44}
.bd.lv중급{color:#f0c05a;border-color:#5e4c1f}
.bd.lv고급{color:#ff7b84;border-color:#5e2429}
.bd.safe{color:#7fd6a6;border-color:#2e5a44}
.bd.out{color:#ff7b84;border-color:#5e2429}
.bd.host{color:#a9b4ff;border-color:#31386b}
.bd.big{color:#fff;background:var(--red);border-color:var(--red)}
.gright{flex:none;width:64px}
.thumb{width:64px;height:64px;border-radius:6px;object-fit:cover;display:block;
       background:var(--surface2);border:1px solid var(--line)}
.star{display:inline-block;color:#4a4a57;cursor:pointer;font-size:19px;line-height:1;
      margin-right:6px;vertical-align:1px;
      transition:color 150ms ease,transform 150ms var(--spring)}
.star:active{transform:scale(1.3)}
.star.on{color:var(--red)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 20px;line-height:1.7}

.rd{background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:14px;margin:0 14px 9px}
.rd.open{border-color:var(--red);box-shadow:3px 3px 0 rgba(232,50,60,.5)}
.rd .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rd .dt{font-family:'Do Hyeon',sans-serif;font-size:19px;letter-spacing:-.3px}
.rd .tm{font-size:12.5px;color:var(--sub)}
.rd .st{font-size:9.5px;font-weight:700;border-radius:3px;padding:3px 7px;margin-left:auto}
.st.open{background:var(--red);color:#fff}
.st.soon,.st.done{background:var(--surface2);color:var(--sub);border:1px solid var(--line)}
.rd .pl{font-size:13.5px;font-weight:600;margin-top:9px}
.rd .ad{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.55}
.rd .nt{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6;
        border-left:3px solid var(--line);padding-left:9px}
.rd .btns{display:flex;gap:6px;margin-top:11px}
.rd .b{flex:1;text-align:center;font-size:12px;font-weight:600;padding:9px 0;border-radius:5px;
       background:var(--surface2);border:1px solid var(--line);text-decoration:none;color:var(--ink);cursor:pointer}
.rd .b.p{background:var(--red);border-color:var(--red);color:#fff}
.monthlab{font-family:'Jua',sans-serif;font-size:13px;color:var(--sub);margin:16px 18px 8px}
/* 참석 여부 */
.rsvp{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:12px 13px}
.rsvp .rt{font-family:'Jua',sans-serif;font-size:13px;letter-spacing:-.5px}
.rsvp .rc{font-size:11.5px;color:var(--sub);font-family:'Pretendard',sans-serif;margin-left:6px}
.rsvp .rc b{color:var(--red-lite)}
.rsvp .rb2{display:flex;gap:7px;margin-top:9px}
.rbtn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;
      padding:11px 0;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.rbtn.yes.on{background:var(--red);border-color:var(--red);color:#fff}
.rbtn.no.on{background:#2b3648;border-color:#3d4a5c;color:#a9c4e0}
.rsvp .rn2{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.5}
.rd.past{opacity:.5}
.rd.past.mine{opacity:1;border-color:#3d4a5c}
.rd.past .dt{color:var(--sub)}
.rd.past.mine .dt{color:var(--ink)}
.mineflag{font-size:9.5px;font-weight:700;border-radius:3px;padding:3px 7px;
          background:#2b3648;color:#a9c4e0;border:1px solid #3d4a5c}
.nowline{display:flex;align-items:center;gap:10px;margin:22px 18px 12px}
.nowline::before,.nowline::after{content:'';height:1px;background:var(--red);flex:1;opacity:.55}
.nowline span{font-family:'Jua',sans-serif;font-size:12px;color:var(--red-lite);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tg{font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:4px 9px;color:var(--ink)}
.tg.p{border-color:#3d4a5c;color:#a9c4e0}
.tg.m{border-color:var(--red);color:var(--red-lite);font-weight:600}
/* 참여자 칩 편집기 */
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px;min-height:6px}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface2);
    border:1px solid #3d4a5c;color:#a9c4e0;border-radius:999px;padding:5px 10px}
.ch.m{border-color:var(--red);color:var(--red-lite);font-weight:600}
.ch b{cursor:pointer;font-weight:400;color:var(--sub);font-size:11px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:50;background:var(--surface);
     border:1px solid var(--red);border-radius:6px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.si{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;font-size:13.5px;
    cursor:pointer;color:var(--red-lite);font-weight:600}
.si span{font-size:10.5px;color:var(--sub);font-weight:400}
.si:hover{background:var(--surface2)}
.si.none{color:var(--sub);font-weight:400;cursor:default}

.hero{margin:12px 14px 0;background:var(--surface);border:1px solid var(--red);
      border-radius:6px;box-shadow:4px 4px 0 rgba(232,50,60,.5);padding:17px 16px}
.hero .rn{display:inline-block;background:var(--red);color:#fff;font-family:'Do Hyeon',sans-serif;
          font-size:12px;border-radius:999px;padding:4px 11px}
.hero .dt{font-family:'Do Hyeon',sans-serif;font-size:24px;margin-top:10px;letter-spacing:-.5px}
.hero .tm{font-size:13.5px;color:var(--sub);margin-top:4px}
.hero .rows{margin-top:13px}
.hero .rw{display:flex;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.hero .rw .k{width:56px;flex:none;color:var(--sub);font-weight:600}
.picked{margin:0 14px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;
        padding:13px 14px;font-size:12.5px;line-height:1.7}
.picked b{color:var(--red-lite)}
.picked .none{color:var(--sub)}
.notice{margin:12px 14px 0;border:1px dashed var(--line);border-radius:6px;padding:13px 14px;
        font-size:11.5px;color:var(--sub);line-height:1.7}

/* 관리자 박스 */
.adminbox{margin:16px 14px 0;border:1px solid var(--red);border-radius:6px;padding:14px;
          background:rgba(232,50,60,.07)}
.adminbox .at{font-family:'Jua',sans-serif;font-size:13px;color:var(--red-lite);margin-bottom:9px}
.adminbox .row{font-size:12.5px;line-height:1.8}
.adminbox .row b{color:var(--ink)}
.abtn{width:100%;margin-top:10px;background:var(--red);color:#fff;border:none;border-radius:5px;
      padding:11px 0;font-size:12.5px;font-weight:700;cursor:pointer}
.abtn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;
         align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-top:3px solid var(--red);border-radius:14px 14px 0 0;
       width:100%;max-width:520px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
       max-height:88vh;overflow-y:auto;animation:up 260ms var(--spring)}
@keyframes up{from{transform:translateY(30px);opacity:.3}to{transform:none;opacity:1}}
.modal h2{font-family:'Do Hyeon',sans-serif;font-size:22px;letter-spacing:-.4px}
.modal .mdesc{font-size:13.5px;margin-top:10px;line-height:1.7}
.mrow{display:flex;gap:10px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.mrow .k{width:64px;flex:none;color:var(--sub);font-weight:600}
.mrule{background:var(--surface2);border-radius:6px;padding:13px;font-size:12.5px;
       color:var(--sub);line-height:1.75;margin-top:14px}
/* 룰 상세 */
.rb{margin-top:18px}
.rb h3{font-family:'Jua',sans-serif;font-size:15px;color:var(--ink);letter-spacing:-.5px;
       display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rb h3::before{content:'';width:4px;height:.85em;background:var(--red);border-radius:2px;flex:none}
.rb p{font-size:13.5px;line-height:1.8;color:#c8cdd6}
.rb ol{margin:4px 0 0 18px;font-size:13.5px;line-height:1.8;color:#c8cdd6}
.rb ol li{margin-top:5px}
.rb img{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:4px;display:block}
.rb .cap{font-size:11.5px;color:var(--sub);margin-top:6px;text-align:center}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtn{flex:1;text-align:center;background:var(--red);color:#fff;border:none;border-radius:6px;
      padding:13px 0;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;display:block}
.mbtn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.mclose{width:100%;margin-top:8px;background:none;border:1px solid var(--line);color:var(--sub);
        border-radius:6px;padding:12px 0;font-size:13px;cursor:pointer}
/* 확인 창 */
.askbox{background:var(--surface);border:1px solid var(--red);border-radius:12px;
        box-shadow:5px 5px 0 rgba(232,50,60,.45);width:100%;max-width:330px;padding:22px 20px 18px;
        animation:pop 200ms var(--spring)}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
.askbox .q{font-size:15px;line-height:1.65;text-align:center}
.askbox .q b{color:var(--red-lite)}
.askbox .btns{display:flex;gap:8px;margin-top:18px}
.askbox .btns button{flex:1;border:none;border-radius:6px;padding:12px 0;font-size:13.5px;
        font-weight:700;cursor:pointer}
.askbox .no{background:var(--surface2);color:var(--sub);border:1px solid var(--line)}
.askbox .yes{background:var(--red);color:#fff}
.fld{margin-top:13px}
.fld label{display:block;font-size:11.5px;color:var(--sub);font-weight:600;margin-bottom:6px}
.fld input,.fld textarea{width:100%;background:var(--surface2);border:1px solid var(--line);
        border-radius:5px;padding:11px 12px;font-size:13.5px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--red)}
.fld textarea{min-height:70px;resize:vertical;line-height:1.6}
.gsel{display:flex;flex-wrap:wrap;gap:6px;max-height:190px;overflow-y:auto;padding:2px}
.gs{font-size:11.5px;border:1px solid var(--line);background:var(--surface2);color:var(--sub);
    border-radius:999px;padding:6px 11px;cursor:pointer}
.gs.on{background:var(--red);border-color:var(--red);color:#fff}

/* 회원 카드 */
.mem{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:13px 14px;margin:0 14px 8px}
.mem.adm{border-color:var(--red)}
.mem .top{display:flex;align-items:baseline;gap:8px}
.mem .nm{font-family:'Do Hyeon',sans-serif;font-size:17px}
.mem .pn{font-size:12px;color:var(--sub)}
.mem .tag{font-size:9px;font-weight:700;border-radius:3px;padding:2px 6px;margin-left:auto;
          background:var(--red);color:#fff}
.mem .sub2{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.mem .btns{display:flex;gap:6px;margin-top:10px}
.mem .b{flex:1;text-align:center;font-size:11.5px;font-weight:600;padding:8px 0;border-radius:5px;
        background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.mem .b.d{color:#ff7b84;border-color:#5e2429}
.tabsw{display:flex;gap:6px;margin-bottom:4px}
.tabsw .t{flex:1;text-align:center;padding:10px 0;border-radius:6px;font-size:13px;font-weight:700;
          background:var(--surface2);border:1px solid var(--line);cursor:pointer;color:var(--sub)}
.tabsw .t.on{background:var(--red);border-color:var(--red);color:#fff}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
      border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

footer{font-size:11px;color:#5d6472;line-height:1.75;padding:22px 18px 6px;text-align:center}
footer a{color:#7a8290}
</style>
</head>
<body>

<header>
  <h1>첫밤 사망자 <span class="r">클럽</span>
    <div class="sub" id="hsub"></div>
  </h1>
  <div class="me" id="meBox" onclick="askNick()"></div>
</header>
<div class="checker"></div>

<!-- 1. 게임 도감 -->
<section class="view on" id="v-games">
  <div class="crew">
    <div class="t">🎲 오늘 몇 명이에요?</div>
    <div class="chips" id="crewChips"></div>
    <div class="msg" id="crewMsg"></div>
  </div>
  <div class="searchbox">
    <input id="q" type="search" placeholder="게임 이름이나 키워드로 검색" autocomplete="off">
    <span class="x" id="qx" style="display:none" onclick="clearQ()">✕</span>
  </div>
  <div class="cattabs" id="cattabs"></div>
  <div class="sortrow">
    <span class="cnt" id="cnt"></span>
    <select id="sort" onchange="renderGames()">
      <option value="cat">기본순</option>
      <option value="people">인원 많은 순</option>
      <option value="short">짧은 순</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div class="list" id="glist"></div>
  <footer>★는 이 기기에만 저장돼요 · 인원·시간은 제조사 기준<br>없는 게임을 들고 오셔도 좋아요</footer>
</section>

<section class="view" id="v-sched">

  <div id="schedList"></div>

<nav>
  <div class="nb on" data-v="games" onclick="setView('games')"><span class="ic">🎲</span><span class="tx">게임 도감</span></div>
  <div class="nb" data-v="sched" onclick="setView('sched')"><span class="ic">📅</span><span class="tx">정모일정</span></div>

<div class="overlay" id="ov" style="display:none" onclick="if(event.target===this)closeM()">
  <div class="modal" id="modal"></div>
</div>

<div class="overlay" id="ask" style="display:none;z-index:3000;align-items:center;padding:24px"
     onclick="if(event.target===this)closeAsk()">
  <div class="askbox" id="askBox"></div>
</div>

<script src="api.js"></script>
<script src="games.js"></script>
<script src="schedule.js"></script>
<script src="past.js"></script>
<script>
/* ══ 상태 ══ */
const RKEY='botc_past_edit', SESS='botc_session';
const ADMINS = ['투넬'];                       // 관리자 닉네임
/* 관리자 비번은 원문을 두지 않고 SHA-256 해시만 둔다.
   ※ 정적 HTML이라 소스를 보면 구조가 다 보인다. 이 잠금은 참가자 화면에서 관리자 UI를
     감추는 용도이지 보안장치가 아니다. */
const ADMIN_HASH = '743e7841942f0114c9ca60aa5742af91fae437bac9161fb88b595f368f12c930';

let acc   = null;                              // 로그인한 계정 (서버에서 받아온 것)
let favs  = [];                                // 즐겨찾기 — 이 기기에만 저장
let picks = JSON.parse(localStorage.getItem('botc_picks_anon')||'[]');   // 로그인 전에는 이 기기, 로그인하면 서버
let edits = JSON.parse(localStorage.getItem(RKEY)||'{}');   // 서버 이전 시절의 로컬 기록(백업용)
let serverPast = [];        // 서버에 저장된 지난 모임 기록 — 시작할 때 불러온다
let MEMBERS = [];           // 전체 회원 — @태그(uid)를 현재 닉네임으로 바꿔 보여줄 때 쓴다
let myRsvp = null;          // 모집중 회차 참석 여부 'yes'|'no'|null
let rsvpCnt = {yes:0,no:0};
let cat='all', crew=0, q='', view='games', authTab='login';

const isAdmin = () => !!acc && acc.admin;
const myNames = () => acc ? [acc.nick, ...(acc.aliases||[])] : [];
const FKEY = () => 'botc_fav_' + (acc?.uid||'anon');

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const openRound = ROUNDS.find(r=>r.st==='open');
const upcoming  = ROUNDS.filter(r=>new Date(r.d) >= TODAY);

/* ══ 세션 ══ */
async function bootSession(){
  const uid = localStorage.getItem(SESS);
  try{
    if(uid) acc = await API.get(uid);
    if(acc){
      favs = JSON.parse(localStorage.getItem(FKEY())||'[]');
      if(openRound){
        picks = await API.getMyPicks(openRound.d, acc.uid);
        myRsvp = await API.getMyRsvp(openRound.d, acc.uid);
      }
    }
  }catch(e){ /* 오프라인이면 그냥 비로그인으로 둔다 */ }
  try{ serverPast = await API.pastList(); }catch(e){}
  try{ MEMBERS = await API.list(); }catch(e){}
  try{ if(openRound) await loadRsvpCnt(); }catch(e){}
  renderMe(); renderGames();
  if(view==='sched') renderSched();
  if(view==='me') renderMePage();
}
async function loadRsvpCnt(){
  const rows = await API.allRsvp(openRound.d);
  rsvpCnt = { yes: rows.filter(r=>r.v==='yes').length, no: rows.filter(r=>r.v==='no').length };
}
function renderMe(){
  document.getElementById('meBox').innerHTML = acc
    ? `<span class="nk">${acc.nick}</span>${isAdmin()?'<br><span class="adm">관리자</span>':''}`
    : `<span class="nk">로그인 ›</span>`;
  document.getElementById('hsub').innerHTML =
    `보유 게임 ${GAMES.filter(g=>g.have!==false).length}종 · 잡아둔 회차 ${upcoming.length}개`;
  document.getElementById('navMembers').style.display = isAdmin() ? '' : 'none';
}

/* ══ 로그인 · 가입 ══ */
function askNick(tab){
  if(tab) authTab = tab;
  if(acc){ myAccountSheet(); return; }
  const isJoin = authTab==='join';
  document.getElementById('modal').innerHTML = `
    <div class="tabsw">
      <div class="t${isJoin?'':' on'}" onclick="askNick('login')">로그인</div>
      <div class="t${isJoin?' on':''}" onclick="askNick('join')">가입하기</div>
    </div>
    <div class="fld"><label>닉네임</label>
      <input id="nkIn" placeholder="예: 투넬 (한글만)" autocomplete="off"></div>
    ${isJoin?`<div class="fld"><label>입금자명</label>
      <input id="pnIn" placeholder="계좌이체 때 찍히는 이름" autocomplete="off"></div>`:''}
    <div class="fld"><label>비밀번호</label>
      <input id="pwIn" type="password" placeholder="비밀번호" autocomplete="${isJoin?'new-password':'current-password'}"></div>
    ${isJoin?`<div class="fld"><label>비밀번호 확인</label>
      <input id="pw2In" type="password" placeholder="한 번 더" autocomplete="new-password"></div>`:''}
    <div id="joinErr" style="display:none;color:var(--red-lite);font-size:12px;margin-top:9px;line-height:1.6"></div>
    ${isJoin?`<div class="notice" style="margin:13px 0 0">입금자명은 실수로 참가비 입금을 닉네임으로 하지 않았을 때 대조하려고 받아요.
      <b style="color:var(--red-lite)">모임장만 볼 수 있고</b> 다른 참가자에게는 보이지 않습니다.<br>
      비밀번호는 원문이 저장되지 않고, 사람마다 다른 값을 섞어 10만 번 뒤섞은 결과만 남습니다.
      그래도 <b style="color:var(--red-lite)">다른 곳에서 쓰는 비밀번호는 쓰지 마세요.</b></div>`:''}
    <div class="mbtns"><button class="mbtn" id="authBtn" onclick="${isJoin?'doJoin()':'doLogin()'}">${isJoin?'가입':'로그인'}</button></div>
    <button class="mclose" onclick="closeM()">닫기</button>`;
  document.getElementById('ov').style.display='flex';
  setTimeout(()=>document.getElementById('nkIn')?.focus(),120);
}
function joinErr(m){
  const el=document.getElementById('joinErr'); el.innerHTML=m; el.style.display='block';
  const b=document.getElementById('authBtn'); if(b){ b.disabled=false; b.textContent=authTab==='join'?'가입':'로그인'; }
}
function busy(t){ const b=document.getElementById('authBtn'); if(b){ b.disabled=true; b.innerHTML=`<span class="spin"></span> ${t}`; } }

async function afterAuth(a){
  acc = a;
  localStorage.setItem(SESS, acc.uid);
  favs = JSON.parse(localStorage.getItem(FKEY())||'[]');
  const anon = JSON.parse(localStorage.getItem('botc_picks_anon')||'[]');
  picks = openRound ? await API.getMyPicks(openRound.d, acc.uid) : [];
  myRsvp = openRound ? await API.getMyRsvp(openRound.d, acc.uid) : null;
  if(anon.length && openRound){                    // 로그인 전에 골라둔 게 있으면 합쳐서 올린다
    picks = [...new Set([...picks, ...anon])];
    try{ await API.setPicks(openRound.d, acc.uid, picks); }catch(e){}
    localStorage.removeItem('botc_picks_anon');
  }
  renderMe(); closeM(); renderGames();
  if(view==='me') renderMePage(); if(view==='sched') renderSched();
}
async function doLogin(){
  const n=document.getElementById('nkIn').value.trim(), p=document.getElementById('pwIn').value;
  if(!n||!p) return joinErr('닉네임과 비밀번호를 적어주세요.');
  busy('확인 중');
  try{ await afterAuth(await API.login(n,p)); }
  catch(e){ joinErr(e.message); }
}
const NICK_RE = /^[가-힣]{1,10}$/;   // 닉네임은 한글 1~10자만
async function doJoin(){
  const n=document.getElementById('nkIn').value.trim();
  const pn=document.getElementById('pnIn').value.trim();
  const p=document.getElementById('pwIn').value, p2=document.getElementById('pw2In').value;
  if(!n)           return joinErr('닉네임을 적어주세요.');
  if(!NICK_RE.test(n)) return joinErr('닉네임은 한글만 쓸 수 있어요 (1~10자, 띄어쓰기·영문·숫자 불가).');
  if(!pn)          return joinErr('입금자명을 적어주세요. 참가비 대조에 씁니다.');
  if(p.length<4)   return joinErr('비밀번호는 4자 이상으로 해주세요.');
  if(p!==p2)       return joinErr('비밀번호 두 개가 서로 달라요.');

  let admin=false;
  if(ADMINS.includes(n)){
    if(await sha256(p) !== ADMIN_HASH)
      return joinErr(`'${n}'은(는) 관리자 전용 닉네임이에요. 다른 닉네임을 써주세요.`);
    admin = true;
  }
  busy('가입 중');
  try{ await afterAuth(await API.signup(n,p,pn,admin)); }
  catch(e){ joinErr(e.message + (/이미 쓰고/.test(e.message)?' 본인 계정이면 <b>로그인</b> 탭으로 들어와주세요.':'')); }
}
function logout(){
  acc=null; favs=[]; picks=[];
  localStorage.removeItem(SESS);
  renderMe(); closeM(); renderGames();
  if(view==='me') renderMePage(); if(view==='sched') renderSched();
  if(view==='members') setView('games');
}
function myAccountSheet(){
  document.getElementById('modal').innerHTML = `
    <h2>내 정보</h2>
    <div class="mdesc"><b style="color:var(--red-lite)">${acc.nick}</b> 으로 접속해 있어요.
      닉네임을 바꿔도 활동 기록은 그대로 따라옵니다.</div>
    <div style="margin-top:14px">
      <div class="mrow"><div class="k">닉네임</div><div>${acc.nick}</div></div>
      <div class="mrow"><div class="k">입금자명</div><div>${acc.payname||'—'}</div></div>
      <div class="mrow"><div class="k">가입일</div><div>${(acc.joined||'').replace(/-/g,'.')}</div></div>
      ${acc.aliases?.length?`<div class="mrow"><div class="k">옛 닉네임</div><div>${acc.aliases.join(', ')}</div></div>`:''}
    </div>
    <div class="fld"><label>닉네임 바꾸기</label><input id="rnIn" value="${acc.nick}"></div>
    <div id="joinErr" style="display:none;color:var(--red-lite);font-size:12px;margin-top:9px"></div>
    <div class="mbtns"><button class="mbtn" id="authBtn" onclick="doRename()">닉네임 변경</button></div>
    <button class="mclose" onclick="logout()">로그아웃</button>
    <button class="mclose" onclick="closeM()">닫기</button>`;
  document.getElementById('ov').style.display='flex';
}
async function doRename(){
  const n=document.getElementById('rnIn').value.trim();
  if(!n) return joinErr('닉네임을 적어주세요.');
  if(!NICK_RE.test(n)) return joinErr('닉네임은 한글만 쓸 수 있어요 (1~10자).');
  if(ADMINS.includes(n) && !isAdmin()) return joinErr('그 닉네임은 관리자 전용이에요.');
  busy('변경 중');
  try{ acc = await API.rename(acc, n); renderMe(); closeM(); if(view==='me') renderMePage(); }
  catch(e){ joinErr(e.message); }
}

/* ══ 뷰 전환 ══ */
function setView(v, skipHash){
  if(v==='members' && !isAdmin()) v='games';
  view=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+v));
  document.querySelectorAll('nav .nb').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  window.scrollTo(0,0);
  if(v==='sched')   renderSched();
  if(v==='me')      renderMePage();
  if(v==='members') renderMembers();
  if(!skipHash && location.hash!=='#'+v) history.replaceState(null,'','#'+v);
}
window.addEventListener('hashchange',()=>{
  const v=(location.hash||'#games').slice(1);
  if(['games','sched','me','members'].includes(v)) setView(v,true);
});

/* ══ 게임 도감 ══ */
document.getElementById('cattabs').innerHTML =
  CATS.map(c=>`<div class="ctab${c.k==='all'?' on':''}" data-k="${c.k}" onclick="setCat('${c.k}')">${c.label}</div>`).join('');
document.getElementById('crewChips').innerHTML =
  ['전체',4,5,6,7,8,9,10,11,12].map(v=>{const n=v==='전체'?0:v;
    return `<div class="chip${n===0?' on':''}" data-n="${n}" onclick="setCrew(${n})">${v==='전체'?'전체':v+'명'}</div>`;}).join('');
document.getElementById('q').addEventListener('input',e=>{
  q=e.target.value.trim();
  document.getElementById('qx').style.display=q?'block':'none';
  renderGames();
});
function clearQ(){q='';document.getElementById('q').value='';document.getElementById('qx').style.display='none';renderGames();}
function setCat(k){cat=k;document.querySelectorAll('.ctab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));renderGames();}
function setCrew(n){crew=n;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.n===n));renderGames();}

const fits = g => !crew || (crew>=g.min && (g.max===null||crew<=g.max));
const peopleTxt = g => g.max===null?`${g.min}명 이상`:(g.min===g.max?`${g.min}명`:`${g.min}~${g.max}명`);
const esc = s => s.replace(/'/g,"\\'");
const byCat = (a,b)=>{const o=c=>CATS.findIndex(x=>x.k===c);return o(a.cat)-o(b.cat);};

function gameCard(g, mode){
  const i=GAMES.indexOf(g);
  const on = mode==='pick' ? picks.includes(g.n) : favs.includes(g.n);
  const fn = mode==='pick' ? `togPick('${esc(g.n)}')` : `togFav('${esc(g.n)}')`;
  return `<div class="game${on?' fav':''}${mode!=='pick'&&crew&&!fits(g)?' dim':''}">
    <div class="info" onclick="openM(${i})">
      <div class="nm"><span class="star${on?' on':''}" onclick="event.stopPropagation();${fn}">${on?'★':'☆'}</span>${g.n}</div>
      <div class="meta"><b>${peopleTxt(g)}</b> · ${g.t}분</div>
      <div class="desc">${g.d}</div>
      <div class="badges">
        <span class="bd lv${g.lv}">${g.lv}</span>
        ${(g.max===null||g.max>=12)?'<span class="bd big">12명 OK</span>':''}
        ${g.out?'<span class="bd out">탈락 있음</span>':'<span class="bd safe">아무도 안 죽음</span>'}
        ${g.host?'<span class="bd host">진행자 필요</span>':''}
        ${isAdmin()?`<span class="bd">${g.own||'소유자 미확인'}</span>`:''}
      </div>
    </div>
    <div class="gright">
      <img class="thumb" src="${cover(g)}" alt="" loading="lazy"
           onerror="this.onerror=null;this.src=fallbackCover('${esc(g.n)}','${g.cat}')">
    </div>
  </div>`;
}

/* 게임 커버 — games.js 에 img 가 있으면 그 사진, 없으면 이름으로 만든 커버를 쓴다.
   (사진 넣는 법은 img/README.md 참고) */
const CATCOLOR = { mafia:'#e8323c', party:'#e0a13a', quick:'#3aa6e0', strategy:'#7a5ce0', coop:'#2fae72' };
function fallbackCover(name, cat){
  const c = CATCOLOR[cat] || '#4a4a57';
  const t = (name||'?').replace(/[\s()·]/g,'').slice(0,2);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
    <rect width="128" height="128" fill="#26262f"/>
    <rect width="128" height="6" fill="${c}"/>
    <text x="64" y="78" font-family="sans-serif" font-size="42" font-weight="700"
      fill="${c}" text-anchor="middle">${t}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function cover(g){ return g.img || fallbackCover(g.n, g.cat); }
function renderGames(){
  let list=GAMES.filter(g=>g.have!==false);
  if(cat!=='all') list=list.filter(g=>g.cat===cat);
  if(q){const s=q.toLowerCase();list=list.filter(g=>(g.n+g.d+g.r+g.lv+g.own).toLowerCase().includes(s));}
  const sort=document.getElementById('sort').value;
  if(sort==='people') list.sort((a,b)=>(b.max===null?99:b.max)-(a.max===null?99:a.max));
  else if(sort==='short') list.sort((a,b)=>a.t-b.t);
  else if(sort==='name') list.sort((a,b)=>a.n.localeCompare(b.n,'ko'));
  else list.sort((a,b)=>byCat(a,b)||(b.max===null?99:b.max)-(a.max===null?99:a.max));
  if(crew) list.sort((a,b)=>(fits(b)?1:0)-(fits(a)?1:0));

  const ok=crew?list.filter(fits).length:list.length;
  document.getElementById('cnt').textContent = crew?`${crew}명 가능 ${ok}개 / 전체 ${list.length}개`:`${list.length}개`;
  document.getElementById('crewMsg').innerHTML = crew
    ? `<b>${crew}명</b>이면 <b>${ok}개</b>가 돌아가요. 나머지는 흐리게 표시됩니다`
    : `인원을 고르면 그 인원으로 <b>돌아가는 게임</b>만 진하게 보여드려요`;
  document.getElementById('glist').innerHTML = list.length
    ? list.map(g=>gameCard(g,'fav')).join('')
    : `<div class="empty">조건에 맞는 게임이 없어요.<br>인원을 바꾸거나 검색어를 지워보세요.</div>`;
}
/* 확인 창 — 게임 고르기 시트 위에도 떠야 해서 모달과 별도 레이어를 쓴다 */
let askYes = null;
function ask(html, onYes){
  askYes = onYes;
  document.getElementById('askBox').innerHTML = `
    <div class="q">${html}</div>
    <div class="btns">
      <button class="no" onclick="closeAsk()">아니요</button>
      <button class="yes" onclick="okAsk()">확인</button>
    </div>`;
  document.getElementById('ask').style.display='flex';
}
function closeAsk(){ document.getElementById('ask').style.display='none'; askYes=null; }
function okAsk(){ const f=askYes; closeAsk(); if(f) f(); }

function togFav(n){
  const on = favs.includes(n);
  ask(on ? `<b>${n}</b><br>즐겨찾기를 해제할까요?`
         : `<b>${n}</b><br>즐겨찾기에 추가할까요?`,
      ()=>{
        favs = on ? favs.filter(f=>f!==n) : [...favs,n];
        localStorage.setItem(FKEY(),JSON.stringify(favs));
        renderGames();
        if(view==='me') renderMePage();
      });
}

/* ══ 정모일정 ══ */
const MAPN = s => 'https://map.naver.com/p/search/'+encodeURIComponent(s);
const fmt  = d => {const [y,m,dd]=d.split('-');return `${+m}/${+dd}`;};

function renderSched(){
  const names = myNames();
  const past  = pastList().slice().sort((a,b)=>a.d.localeCompare(b.d));   // 오래된 것부터
  const mineOf = p => (p.people||[]).some(pIsMe);

  /* 지난 모임 — 내가 참석한 것만 자세히 보이고, 나머지는 날짜·장소만 흐리게.
     관리자는 전부 볼 수 있다. */
  let html='', lastM='';
  past.forEach(p=>{
    const mine = mineOf(p), open = mine || isAdmin();
    const m=p.d.slice(0,7);

/* ══ 캘린더 저장 ══
   .ics 파일을 즉석에서 만들어 연다. 아이폰은 캘린더 앱이, 안드로이드는 선택창이 뜬다.
   구글 캘린더로 바로 넣고 싶은 사람을 위해 링크도 같이 준다. */
function icsStamp(d, t){                       // '2026-08-15','11:00' → '20260815T110000'
  return d.replace(/-/g,'') + 'T' + t.replace(':','') + '00';
}
function makeICS(r){
  const title = `첫밤 사망자 클럽${r.r?` ${r.r}회차`:''}`;
  const desc  = [r.place, r.addr, r.fee?`참가비 ${r.fee}`:'', r.after?`2차 ${r.after} (자율)`:'']
                  .filter(Boolean).join('\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//첫밤 사망자 클럽//KR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:botc-${r.d}@firstnight.club`,
    `DTSTAMP:${icsStamp(new Date().toISOString().slice(0,10), '00:00')}Z`,
    `DTSTART;TZID=Asia/Seoul:${icsStamp(r.d, r.s)}`,
    `DTEND;TZID=Asia/Seoul:${icsStamp(r.d, r.e)}`,
    `SUMMARY:${title}`,
    `LOCATION:${(r.addr||r.place).replace(/,/g,'\\,')}`,
    `DESCRIPTION:${desc}`,
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:내일 첫밤 사망자 클럽','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function saveCal(){
  const r = openRound; if(!r) return;
  const ics = makeICS(r);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `첫밤사망자클럽_${r.d}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function googleCal(){
  const r = openRound; if(!r) return '#';
  const p = new URLSearchParams({
    action:'TEMPLATE',
    text:`첫밤 사망자 클럽${r.r?` ${r.r}회차`:''}`,
    dates:`${icsStamp(r.d,r.s)}/${icsStamp(r.d,r.e)}`,
    details:[r.place, r.fee?`참가비 ${r.fee}`:''].filter(Boolean).join('\n'),
    location:r.addr||r.place, ctz:'Asia/Seoul',
  });
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

async function togPick(n){

/* ══ 참여자 표기 ══
   people 배열의 항목은 두 종류다.
     "이름"        수기 기록 — 그대로 보여준다
     { uid:"..." }  회원 태그 — 지금 닉네임을 찾아 보여준다. 닉변해도 따라간다 */
function pName(x){
  if(typeof x === 'string') return x;
  const m = MEMBERS.find(m=>m.uid===x.uid);
  return m ? m.nick : (x.label || '(탈퇴한 회원)');
}
function pIsMe(x){
  if(!acc) return false;
  if(typeof x === 'object') return x.uid === acc.uid;
  return myNames().includes(x);
}
function pTag(x){
  return typeof x === 'object'
    ? `<span class="tg m">@${pName(x)}</span>`
    : `<span class="tg p">${x}</span>`;
}

/* ══ 지난정모 ══ */
function pastList(){
  /* 씨앗(past.js) → 로컬 편집(구버전 호환) → 서버 기록 순으로 겹쳐 쓴다. 서버가 최종. */
  const by = {};
  PAST.forEach(p=>by[p.d]={...p});
  Object.entries(edits).forEach(([d,v])=>by[d]={...(by[d]||{}),...v});
  serverPast.forEach(p=>by[p.d]={...(by[p.d]||{}),...p});
  return Object.values(by).sort((a,b)=>b.d.localeCompare(a.d));
}

/* ── 참여자 칩 편집기 ──
   editPeople: ["수기이름", {uid:"...", label:"태그당시닉"}] 혼합 배열 */
let editPeople = [];
function initPplEditor(init){
  editPeople = init.map(x => typeof x==='string' ? x : {uid:x.uid, label:x.label||pName(x)});
  const inp = document.getElementById('pplIn');
  inp.addEventListener('input', pplSuggest);
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); pplCommit(); }
    else if(e.key==='Backspace' && !inp.value && editPeople.length){ editPeople.pop(); renderPpl(); }
  });
  renderPpl();
}
function renderPpl(){
  const box=document.getElementById('pplChips'); if(!box) return;
  box.innerHTML = editPeople.map((x,i)=> typeof x==='string'
    ? `<span class="ch">${x}<b onclick="editPeople.splice(${i},1);renderPpl()">✕</b></span>`
    : `<span class="ch m">@${pName(x)}<b onclick="editPeople.splice(${i},1);renderPpl()">✕</b></span>`
  ).join('');
}
function pplSuggest(){
  const inp=document.getElementById('pplIn'), sug=document.getElementById('pplSug');
  const v=inp.value.trim();
  if(!v.startsWith('@')){ sug.style.display='none'; return; }
  const q=v.slice(1);
  const taken=new Set(editPeople.filter(x=>typeof x==='object').map(x=>x.uid));
  const hits=MEMBERS.filter(m=>!taken.has(m.uid) && (!q || m.nick.includes(q))).slice(0,6);
  sug.innerHTML = hits.length
    ? hits.map(m=>`<div class="si" onclick="pplPick('${m.uid}')">@${m.nick}<span>${(m.joined||'').slice(2)}</span></div>`).join('')
    : `<div class="si none">'${q}' 닉네임의 회원이 없어요</div>`;
  sug.style.display='block';
}
function pplPick(uid){
  const m=MEMBERS.find(m=>m.uid===uid); if(!m) return;
  editPeople.push({uid, label:m.nick});
  document.getElementById('pplIn').value='';
  document.getElementById('pplSug').style.display='none';
  renderPpl();
}
function pplCommit(){
  const inp=document.getElementById('pplIn');
  const v=inp.value.trim(); if(!v) return;
  if(v.startsWith('@')){
    // @입력 후 엔터 — 정확히 일치하는 회원이 있으면 태그, 없으면 무시
    const m=MEMBERS.find(m=>m.nick===v.slice(1));
    if(m) pplPick(m.uid);
    return;
  }
  if(!editPeople.includes(v)) editPeople.push(v);
  inp.value=''; document.getElementById('pplSug').style.display='none';
  renderPpl();
}

function savePast(){
  pplCommit();                       // 입력창에 쓰다 만 이름도 챙긴다
  const v=id=>document.getElementById(id).value.trim();
  const d=v('e_d');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('날짜를 2026-08-08 형식으로 적어주세요'); return; }
  const rn=v('e_r');
  edits[d]={
    d, dow:v('e_dow'), s:v('e_s'), e:v('e_e'),
    r: rn?+rn:null, kind: rn?'round':'flash',
    place:v('e_place'), fee:v('e_fee'), after:v('e_after'), memo:v('e_memo'),
    people: editPeople.slice(),
    played: [...document.querySelectorAll('#gsel .gs.on')].map(el=>el.dataset.n),
  };
  const rec = edits[d];
  localStorage.setItem(RKEY,JSON.stringify(edits));   // 일단 로컬에 남겨 유실을 막는다
  (async()=>{
    try{
      await API.pastSave(rec);
      serverPast = await API.pastList();
      delete edits[d]; localStorage.setItem(RKEY,JSON.stringify(edits));   // 서버 성공 후에만 로컬 정리
    }
    catch(e){ alert('서버 저장에 실패했어요. 이 기기에는 남아 있으니 네트워크 확인 후 다시 저장해주세요.'); }
    closeM(); schedScrolled=true; renderSched();
  })();
}
function delPast(d){
  if(!confirm('이 기록을 지울까요?')) return;
  delete edits[d]; localStorage.setItem(RKEY,JSON.stringify(edits));
  (async()=>{
    try{ await API.pastDelete(d); serverPast = await API.pastList(); }catch(e){}
    closeM(); schedScrolled=true; renderSched();
  })();
}
function exportPast(){
  const code='const PAST = '+JSON.stringify(pastList(),null,2)+';';
  navigator.clipboard?.writeText(code).then(
    ()=>alert('past.js 코드를 복사했어요.\n게임도감 폴더의 past.js 내용을 이걸로 바꾸면 모두에게 반영됩니다.'),
    ()=>prompt('아래를 복사해 past.js에 붙여넣으세요', code));
}

/* ══ 마이페이지 ══ */
function renderMePage(){
  const body=document.getElementById('meBody');
  if(!acc){
    body.innerHTML=`<div class="empty">로그인하면 내 활동 기록을 볼 수 있어요.<br><br>
      <span style="display:inline-block;background:var(--red);color:#fff;padding:11px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer" onclick="askNick('login')">로그인 · 가입하기</span></div>`;

  }
  const list = pastList();

  const cnt = mineRounds.length;
  const first = mineRounds[0], last = mineRounds[cnt-1];
  const daysSince = first ? Math.floor((TODAY - new Date(first.d))/86400000) : null;

  const playedSet = new Set();
  mineRounds.forEach(p=>(p.played||[]).forEach(g=>playedSet.add(g)));
  const total = GAMES.filter(g=>g.have!==false).length;
  const pct = Math.round(playedSet.size/total*100);
  const wish = favs.filter(n=>!playedSet.has(n));
  const next = upcoming[0];
  const dday = next ? Math.round((new Date(next.d)-TODAY)/86400000) : null;

  body.innerHTML=`
    <div class="hero" style="text-align:center">
      <div style="font-size:40px;line-height:1">🔪</div>
      <div class="dt" style="margin-top:6px">${acc.nick}</div>
      <div class="tm">${isAdmin()?'관리자':'첫밤 사망자 클럽 멤버'}</div>
      <div class="rows" style="text-align:left">
        <div class="rw"><div class="k">참석</div><div>${cnt?`${cnt}번`:'아직 기록 없음'}</div></div>
        ${first?`<div class="rw"><div class="k">첫 참석</div><div>${first.d.replace(/-/g,'.')} (${first.dow}) · ${daysSince}일 전</div></div>`:''}
        ${last&&cnt>1?`<div class="rw"><div class="k">최근</div><div>${last.d.replace(/-/g,'.')} (${last.dow})</div></div>`:''}
        <div class="rw"><div class="k">해본 게임</div><div>${playedSet.size} / ${total}종 · ${pct}%</div></div>
        ${acc.joined?`<div class="rw"><div class="k">가입일</div><div>${acc.joined.replace(/-/g,'.')}</div></div>`:''}
        ${acc.aliases?.length?`<div class="rw"><div class="k">옛 닉네임</div><div>${acc.aliases.join(', ')}<br><span style="color:var(--sub);font-size:11px">이 이름으로 남은 기록도 함께 잡혀요</span></div></div>`:''}
        <div class="rw"><div class="k">내 아이디</div><div style="font-family:ui-monospace,monospace;font-size:11.5px;color:var(--sub)">${acc.uid.slice(0,8)}</div></div>
      </div>
    </div>

    ${next?`<div class="notice" style="text-align:center">다음 모임 <b style="color:var(--red-lite)">${fmt(next.d)} (${next.dow})</b>
      ${dday===0?'· 오늘이에요!':dday>0?`· D-${dday}`:''}</div>`:''}

    ${picks.length?`
      <div class="label">이번 회차에 고른 게임 · ${picks.length}개</div>
      <div class="picked" style="margin:0 14px">${picks.join(' · ')}</div>`:''}

    <div class="label">내 즐겨찾기 · ${favs.length}개</div>
    ${favs.length
      ? `<div class="tags" style="margin:0 18px">${favs.map(n=>`<span class="tg">${playedSet.has(n)?'✓ ':''}${n}</span>`).join('')}</div>
         ${wish.length?`<div class="notice">이 중 <b style="color:var(--red-lite)">${wish.length}개</b>는 아직 못 해봤어요 — ${wish.join(' · ')}</div>`:''}`
      : `<div class="empty" style="padding:22px">게임 도감에서 ★를 눌러 담아보세요.</div>`}

    <div class="label">내가 참여한 모임</div>
    ${cnt ? [...mineRounds].reverse().map(p=>`
        <div class="rd">
          <div class="top">
            <span class="dt">${fmt(p.d)} <span style="font-size:14px">(${p.dow})</span></span>
            <span class="tm">${p.s}~${p.e}</span>
            <span class="st done">${p.kind==='flash'?'번개':(p.r?p.r+'회차':'정모')}</span>
          </div>
          <div class="pl">${p.place}</div>
          ${(p.played||[]).length?`<div class="tags">${p.played.map(g=>`<span class="tg">${g}</span>`).join('')}</div>`:''}
        </div>`).join('')
      : `<div class="empty" style="padding:26px 20px">아직 참여 기록이 없어요.<br>
          모임에 다녀오면 관리자가 참여자를 기록합니다.</div>`}

    <div class="notice">닉네임을 바꿔도 활동 기록은 그대로 따라옵니다. 계정은 내 아이디로 구분되고,
      예전에 쓰던 닉네임도 같이 기억해뒀다가 대조하거든요.</div>
    <div style="margin:14px"><button class="abtn ghost" onclick="askNick()">내 정보 · 닉네임 변경</button></div>
    <footer>즐겨찾기는 이 기기에, 고른 게임은 서버에 저장돼요</footer>`;
}

/* ══ 회원관리 (관리자 전용) ══ */
let MEMS = [];
async function renderMembers(){
  const body=document.getElementById('memBody');
  body.innerHTML=`<div class="empty"><span class="spin"></span> 회원 불러오는 중…</div>`;
  try{ MEMS = await API.list(); }
  catch(e){ body.innerHTML=`<div class="empty">회원을 못 불러왔어요.<br>${e.message}</div>`; return; }

  const list=pastList();
  const cntOf = m => list.filter(p=>(p.people||[]).some(x=>
    (typeof x==='object' && x.uid===m.uid) || (typeof x==='string' && [m.nick,...(m.aliases||[])].includes(x)))).length;
  let agg='';
  if(openRound){
    try{
      const rows = await API.allPicks(openRound.d);
      const tally={};
      rows.forEach(r=>r.games.forEach(g=>tally[g]=(tally[g]||0)+1));
      const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
      if(sorted.length){
        const grp={};
        sorted.forEach(([g,c])=>{const o=GAMES.find(x=>x.n===g)?.own||'미확인';(grp[o]=grp[o]||[]).push(`${g} ${c}표`);});
        agg=`<div class="adminbox">
          <div class="at">🗳️ ${fmt(openRound.d)} 회차 게임 집계 · ${rows.length}명 참여</div>
          ${sorted.slice(0,8).map(([g,c])=>`<div class="row"><b>${g}</b> — ${c}표</div>`).join('')}
          <div class="at" style="margin-top:12px">🎒 챙겨갈 목록</div>
          ${Object.entries(grp).map(([o,ns])=>`<div class="row"><b>${o}</b> — ${ns.join(', ')}</div>`).join('')}
        </div>`;
      } else {
        agg=`<div class="notice">${fmt(openRound.d)} 회차에 아직 게임을 고른 사람이 없어요.</div>`;
      }
    }catch(e){}
  }

  body.innerHTML=`
    <div class="label">회원 ${MEMS.length}명</div>
    ${agg}
    <div class="notice">입금자명은 참가비 대조용이에요. 참가자에게는 안 보입니다.</div>
    <div style="margin-top:12px">${MEMS.map((m,i)=>`
      <div class="mem${m.admin?' adm':''}">
        <div class="top">
          <span class="nm">${m.nick}</span>
          <span class="pn">${m.payname||'입금자명 없음'}</span>
          ${m.admin?'<span class="tag">관리자</span>':''}
        </div>
        <div class="sub2">
          가입 ${(m.joined||'').replace(/-/g,'.')} · 참석 ${cntOf(m)}번
          ${m.aliases?.length?`<br>옛 닉네임 — ${m.aliases.join(', ')}`:''}
          <br><span style="font-family:ui-monospace,monospace">${m.uid.slice(0,8)}</span>
        </div>
        <div class="btns">
          <span class="b" onclick="memEdit(${i})">✏️ 수정</span>
          <span class="b" onclick="memPw(${i})">🔑 비번 초기화</span>
          ${m.admin?'':`<span class="b d" onclick="memDel(${i})">삭제</span>`}
        </div>
      </div>`).join('')||`<div class="empty">아직 가입한 회원이 없어요.</div>`}
    <div style="margin:14px"><button class="abtn ghost" onclick="renderMembers()">🔄 새로고침</button></div>
    <footer>회원 정보는 서버에 저장됩니다</footer>`;
}
function memEdit(i){
  const m=MEMS[i];
  document.getElementById('modal').innerHTML=`
    <h2>${m.nick}</h2>
    <div class="mdesc">닉네임을 바꾸면 옛 이름이 기록에 남아 지난 활동이 계속 잡힙니다.</div>
    <div class="fld"><label>닉네임</label><input id="m_nick" value="${m.nick}"></div>
    <div class="fld"><label>입금자명</label><input id="m_pay" value="${m.payname||''}"></div>
    <div id="joinErr" style="display:none;color:var(--red-lite);font-size:12px;margin-top:9px"></div>
    <div class="mbtns"><button class="mbtn" id="authBtn" onclick="memSave(${i})">저장</button></div>
    <button class="mclose" onclick="closeM()">닫기</button>`;
  document.getElementById('ov').style.display='flex';
}
async function memSave(i){
  const m=MEMS[i];
  const n=document.getElementById('m_nick').value.trim();
  const p=document.getElementById('m_pay').value.trim();
  if(!n) return joinErr('닉네임을 적어주세요.');
  if(!NICK_RE.test(n)) return joinErr('닉네임은 한글만 쓸 수 있어요 (1~10자).');
  busy('저장 중');
  try{
    let cur = await API.get(m.uid);
    if(n!==cur.nick) cur = await API.rename(cur, n);
    cur.payname = p; await API.save(cur);
    if(acc && acc.uid===cur.uid){ acc=cur; renderMe(); }
    closeM(); renderMembers();
  }catch(e){ joinErr(e.message); }
}
function memPw(i){
  const m=MEMS[i];
  document.getElementById('modal').innerHTML=`
    <h2>비밀번호 초기화</h2>
    <div class="mdesc"><b style="color:var(--red-lite)">${m.nick}</b> 님의 비밀번호를 새로 정합니다.
      정한 비밀번호를 본인에게 알려주고, 로그인한 뒤 바꾸도록 안내해주세요.</div>
    <div class="fld"><label>새 비밀번호</label><input id="m_pw" type="text" placeholder="4자 이상"></div>
    <div id="joinErr" style="display:none;color:var(--red-lite);font-size:12px;margin-top:9px"></div>
    <div class="mbtns"><button class="mbtn" id="authBtn" onclick="memPwSave(${i})">초기화</button></div>
    <button class="mclose" onclick="closeM()">닫기</button>`;
  document.getElementById('ov').style.display='flex';
}
async function memPwSave(i){
  const pw=document.getElementById('m_pw').value;
  if(pw.length<4) return joinErr('4자 이상으로 해주세요.');
  busy('저장 중');
  try{
    const cur = await API.get(MEMS[i].uid);
    await API.setPw(cur, pw);
    closeM(); alert('비밀번호를 바꿨어요. 본인에게 알려주세요.');
  }catch(e){ joinErr(e.message); }
}
async function memDel(i){
  const m=MEMS[i];
  if(!confirm(`${m.nick} 회원을 지울까요? 되돌릴 수 없어요.`)) return;
  try{ await API.remove(await API.get(m.uid) || m); renderMembers(); }
  catch(e){ alert('삭제에 실패했어요: '+e.message); }
}

/* ══ 게임 상세 ══ */

  document.getElementById('modal').innerHTML=`
    <div style="display:flex;gap:13px;align-items:flex-start">

           flex:none;background:var(--surface2);border:1px solid var(--line)">

        <h2>${g.n}</h2>
        <div class="mdesc" style="margin-top:7px">${g.d}</div>
      </div>
    </div>
    <div style="margin-top:14px">
      <div class="mrow"><div class="k">인원</div><div>${peopleTxt(g)}${(g.max===null||g.max>=12)?' · 12명 회차 가능':''}</div></div>
      <div class="mrow"><div class="k">시간</div><div>약 ${g.t}분</div></div>
      <div class="mrow"><div class="k">난이도</div><div>${g.lv}</div></div>
      <div class="mrow"><div class="k">탈락</div><div>${g.out?'있음 — 죽으면 관전':'없음 — 끝까지 참여'}</div></div>
      <div class="mrow"><div class="k">진행자</div><div>${g.host?'필요':'필요 없음'}</div></div>
      ${g.bl?`<div class="mrow"><div class="k">평점</div><div>⭐ ${g.bl.rate} / 10 · 난이도 ${g.bl.weight}${g.bl.rank?` · 종합 ${g.bl.rank}위`:''}<br><span style="color:var(--sub);font-size:11px">보드라이프 유저 평가 기준</span></div></div>`:''}
      ${isAdmin()?`<div class="mrow"><div class="k">소유자</div><div>${g.own||'미확인'}</div></div>`:''}
    </div>
    <div class="mrule"><b style="color:var(--ink)">어떻게 하는 게임인가요</b><br>${g.r}</div>
    ${g.bl?`<div style="display:flex;gap:6px;margin-top:10px">
      <a class="mclose" style="flex:1;margin:0;text-decoration:none;text-align:center" href="${g.bl.url}" target="_blank" rel="noopener">보드라이프에서 보기</a>
      ${g.bl.bgg?`<a class="mclose" style="flex:1;margin:0;text-decoration:none;text-align:center" href="${g.bl.bgg}" target="_blank" rel="noopener">BGG에서 보기</a>`:''}
    </div>`:''}
    <div class="mbtns">
      <button class="mbtn" onclick="openRules(${i})">📖 룰 자세히 보기${g.rules?.length?'':' (준비 중)'}</button>
      <button class="mbtn ghost" onclick="${fn};closeM()">${on?'★ 해제':(inPick?'☆ 이거 하고 싶어요':'☆ 관심 표시')}</button>
    </div>
    <a class="mclose" style="display:block;text-align:center;text-decoration:none" href="${yt}" target="_blank" rel="noopener">📺 유튜브에서 설명 영상 찾기</a>
    <button class="mclose" onclick="closeM()">닫기</button>`;
  document.getElementById('ov').style.display='flex';
}
/* 룰 자세히 보기 — games.js 의 rules 배열을 순서대로 그린다.
   글·번호목록·사진을 섞을 수 있고, 아직 없으면 준비 중 화면이 뜬다. */
function openRules(i){
  const g = GAMES[i];
  const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(g.n+' 보드게임 룰');
  const body = (g.rules||[]).map(b=>{
    if(b.img) return `<div class="rb">${b.h?`<h3>${b.h}</h3>`:''}
      <img src="${b.img}" alt="" loading="lazy">${b.cap?`<div class="cap">${b.cap}</div>`:''}</div>`;
    return `<div class="rb">
      ${b.h?`<h3>${b.h}</h3>`:''}
      ${b.p?`<p>${b.p}</p>`:''}
      ${b.list?`<ol>${b.list.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}
    </div>`;
  }).join('');

  document.getElementById('modal').innerHTML=`
    <div style="display:flex;gap:13px;align-items:center">
      <img src="${cover(g)}" alt="" style="width:56px;height:56px;border-radius:8px;object-fit:cover;
           flex:none;background:var(--surface2);border:1px solid var(--line)">
      <div><h2>${g.n}</h2>
        <div style="font-size:12px;color:var(--sub);margin-top:4px">${peopleTxt(g)} · ${g.t}분 · ${g.lv}</div></div>
    </div>
    <div class="mrule" style="margin-top:14px">${g.r}</div>
    ${body || `<div class="empty" style="padding:34px 12px">
        아직 룰이 정리되지 않았어요.<br>정리되면 여기에 글과 사진으로 올라옵니다.<br><br>
        <span style="font-size:11.5px">그전까지는 아래 영상으로 봐주세요.</span></div>`}
    <div class="mbtns" style="margin-top:20px">
      <a class="mbtn ghost" href="${yt}" target="_blank" rel="noopener">📺 영상으로 보기</a>
      <button class="mbtn" onclick="openM(${i})">← 게임 정보로</button>
    </div>
    <button class="mclose" onclick="closeM()">닫기</button>`;
  document.getElementById('ov').style.display='flex';
  document.querySelector('.modal').scrollTop = 0;
}

function closeM(){
  document.getElementById('ov').style.display='none';
  if(view==='me') renderMePage();
  else if(view==='sched') renderSched();
  else if(view==='members') renderMembers();
  else renderGames();
}

/* ══ 시작 ══ */
renderMe(); renderGames();
{
  const v=(location.hash||'#games').slice(1);
  if(['sched','me','members'].includes(v)) setView(v,true);
}
bootSession();

/* 주소에 ?rules=게임이름 을 붙이면 그 게임 룰이 바로 열린다.
   "달무티 룰 여기서 봐" 하고 링크만 던지면 되게. */
{
  const want = new URLSearchParams(location.search).get('rules');
  if(want){
    const i = GAMES.findIndex(g=>g.n===want);
    if(i>=0) openRules(i);
  }
}
</script>
